stage: c
new_tokens: 256
max_tokens: 256
max_steps: 8
optimizer:
  name: adamw_torch_fused
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
scheduler:
  name: wsd
  warmup_steps: 1
  stable_ratio: 0.80
  min_lr_ratio: 0.10
batch:
  sequence_length: 32
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  num_processes: 1
  tokens_per_step: 32
training:
  seed: 0
  logging_steps: 1
  eval_steps: 0
  save_steps: 0
  gradient_checkpointing: false
  dataloader_num_workers: 0
  max_tokens: 256
  attention_implementation: eager
  allow_replay: false
