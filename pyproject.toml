[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullxes-shinra"
version = "2.0.0"
description = "NULLXES SHINRA-4B v2 — proprietary language intelligence layer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NULLXES Research" }]
keywords = ["llm", "transformer", "shinra", "nullxes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
  "pyarrow>=20.0.0",
]

[project.optional-dependencies]
data = []

[project.scripts]
shinra-pretrain = "training.pretrain:main"
shinra-pack-data = "data.pack:main"
shinra-generate-synthetic = "data.synthetic_engine:main"
shinra-build-synthetic-corpus = "data.build_synthetic_corpus:main"
shinra-tokenize = "tokenizer.train_tokenizer:main"
shinra-generate = "inference.generate:main"
shinra-serve = "inference.server:main"
shinra-publish = "scripts.publish_hub:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "architecture*",
  "configs*",
  "model*",
  "tokenizer*",
  "data*",
  "training*",
  "evaluation*",
  "inference*",
  "scripts*",
]

[tool.setuptools.package-data]
tokenizer = ["chat_template.jinja"]
configs = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
