[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullxes-shinra"
version = "2.0.0"
description = "NULLXES SHINRA-4B v2 — proprietary language intelligence layer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NULLXES Research" }]
keywords = ["llm", "transformer", "shinra", "nullxes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6.0",
  "transformers==5.16.1",
  "accelerate==1.15.0",
  "tokenizers==0.23.1",
  "sentencepiece==0.2.2",
  "safetensors==0.8.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
  "pyarrow==25.0.1",
]

[project.optional-dependencies]
train = ["wandb>=0.17.0"]
eval = [
  "lm-eval>=0.4.4",
  "nltk>=3.8.1",
  "sacrebleu>=2.4.2",
]
infer = [
  "fastapi>=0.112.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "sse-starlette>=2.1.0",
]
lang = ["fasttext-wheel>=0.9.2"]
all = ["nullxes-shinra[train,eval,infer]"]

[project.scripts]
shinra-pretrain = "training.pretrain:main"
shinra-tokenize = "tokenizer.train_tokenizer:main"
shinra-generate = "inference.generate:main"
shinra-serve = "inference.server:main"
shinra-publish = "scripts.publish_hub:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "architecture*",
  "model*",
  "tokenizer*",
  "data*",
  "training*",
  "evaluation*",
  "inference*",
  "scripts*",
]

[tool.setuptools.package-data]
tokenizer = ["*.jinja", "*.json"]
configs = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
