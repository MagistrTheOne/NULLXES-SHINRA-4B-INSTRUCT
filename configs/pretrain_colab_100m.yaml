stage: pretrain_colab_hypothesis
output_name: NULLXES-SHINRA-4B-HYPOTHESIS
max_tokens: 100000000
max_steps: 6104

optimizer:
  name: adamw_torch_fused
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0

scheduler:
  name: wsd
  warmup_steps: 100
  stable_ratio: 0.80
  min_lr_ratio: 0.10

batch:
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_processes: 1
  tokens_per_step: 16384

training:
  seed: 42
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  gradient_checkpointing: true
  dataloader_num_workers: 2
  max_tokens: 100000000

hardware:
  gpu: NVIDIA A100 80GB
  node_gpus: 1
  precision: bf16
  flash_attention: true
  fsdp: false
