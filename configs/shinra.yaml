# Single source of truth for SHINRA model, data policy, training, evaluation,
# checkpointing, and runtime. Training stays disabled until all audit gates pass.
schema_version: nullxes.shinra.v4
status: data_tokenizer_and_runtime_audit_required

identity:
  family: NULLXES-SHINRA
  release: NULLXES-SHINRA-4B-INSTRUCT
  invariant: "SHINRA is SHINRA. Created by NULLXES."
  initialization: random
  historical_weights_allowed: false
  historical_resume_allowed: false

model:
  model_type: nullxes_shinra
  architectures: [ShinraForCausalLM]
  hidden_size: 2560
  intermediate_size: 9728
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  vocab_size: 65536
  max_position_embeddings: 32768
  train_sequence_length: 4096
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  rope_scaling: {rope_type: default}
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  qk_norm: true
  initializer_range: 0.02
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 3
  document_end_token_id: 4
  z_loss_coefficient: 1.0e-5
  attention_implementation: sdpa

tokenizer:
  status: provisional_until_corpus_audit
  backend: sentencepiece_native
  native_model_sha256: 372eb8e5b82a950af7db3fd54d1ded4a36116016af6103076074ef99d9a0d83c
  artifact_dir: tokenizer/artifacts
  algorithm: unigram
  vocab_size: 65536
  vocab_candidates: [32768, 49152, 65536, 98304]
  byte_fallback: true
  character_coverage: 0.99995
  normalization: identity  # SentencePiece only; Unicode NFC is data.cleaning.unicode_normalization
  build:
    max_chars: null  # Must be selected from the approved corpus audit before building.
    input_sentence_size: null
    num_threads: null
    max_sentence_bytes: 65536
  split_digits: false
  unk_id: 0
  bos_id: 1
  end_of_turn_id: 2
  pad_id: 3
  end_of_document_id: 4
  special_token_ids:
    system: 5
    user: 6
    assistant: 7
    reasoning: 8
    code: 9
    language: 10
    fim_prefix: 11
    fim_suffix: 12
    fim_middle: 13
    repo: 14
    file: 15
    tool_call: 16
    tool_response: 17
    document: 18
  artifact_sha256: null  # SHA256 identity of tokenizer_manifest.json, NOT tokenizer.json.
  special_tokens:
    unk: "<|unk|>"
    bos: "<|bos|>"
    end_of_turn: "<|eot|>"
    pad: "<|pad|>"
    end_of_document: "<|end_of_text|>"
    system: "<|system|>"
    user: "<|user|>"
    assistant: "<|assistant|>"
    reasoning: "<|reasoning|>"
    code: "<|code|>"
    language: "<|language|>"
    fim_prefix: "<|fim_prefix|>"
    fim_suffix: "<|fim_suffix|>"
    fim_middle: "<|fim_middle|>"
    repo: "<|repo|>"
    file: "<|file|>"
    tool_call: "<|tool_call|>"
    tool_response: "<|tool_response|>"
    document: "<|document|>"
  add_bos_in_tokenizer: false
  chat_template_adds_bos: true
  chat_turn_stop_id: 2
  require_exact_roundtrip: true
  require_zero_unk_on_probes: true
  numeric_rewrite: forbidden

data:
  acquisition: pinned_huggingface_parquet_stream
  training_enabled: false
  source_manifest_required: true
  manifest_sha256: c23fac085659e4896e67a9af03c29574f08ca160e5d86a6bf882ac3ee42d015c
  immutable_revision_required: true
  parquet_batch_rows: 512
  provenance_fields: [source_id, revision, document_id, url_or_archive_id, license, language, split, raw_sha256, transform_version, clean_sha256]
  split_salt: "NULLXES-SHINRA-AUDIT-2026-10-16-v1"
  splits: {train: 0.98, validation: 0.01, blind: 0.01}
  split_unit: source_document_or_work_before_chunking
  packed_shard_tokens: 100000000
  sources:
    - id: Wikimedia/wikipedia
      repo_type: dataset
      subsets: [20231101.en, 20231101.ru]
      languages: [en, ru]
      language_by_subset: {20231101.en: en, 20231101.ru: ru}
      parquet_prefixes: [20231101.en/, 20231101.ru/]
      subset_by_path: {20231101.en: 20231101.en, 20231101.ru: 20231101.ru}
      text_field: text
      document_id_field: id
      title_field: title
      url_field: url
      cleaning_profile: wikimedia_rendered_text
      quarantine_profile: table_and_markup
      license_claim: "CC-BY-SA-3.0 and GFDL-1.3; page-level terms may vary"
      upstream_url: https://huggingface.co/datasets/wikimedia/wikipedia
      status: audit_only
      revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
      rights_review_status: audit_only
      provenance_review_status: audit_only
      license_review_required: true
    - id: PleIAs/Russian-PD
      repo_type: dataset
      subsets: [default]
      languages: [ru]
      language_by_subset: {default: ru}
      parquet_prefixes: [russian_pd_]
      subset_by_path: {}
      text_field: text
      document_id_field: identifier
      title_field: title
      cleaning_profile: plain_text_nfc
      quarantine_profile: ocr_book
      license_claim: "Publisher claims worldwide public domain; each work remains subject to independent review"
      upstream_url: https://huggingface.co/datasets/PleIAs/Russian-PD
      status: audit_only
      revision: 12e0ad67405dcf1e79154aa6a4c6cdb77947ab2d
      rights_review_status: audit_only
      provenance_review_status: audit_only
      ocr_review_required: true
      license_review_required: true
  excluded_sources: [FineWeb, FineWeb-Edu, FineWeb-2, SmolLM-Corpus]
  cleaning:
    strict_decode: true
    unicode_normalization: NFC
    preserve_numbers_dates_units_signs_decimals_and_math: true
    verify_numeric_spans_after_cleaning: true
    reject_malformed_records_with_reason: true
    silent_skip: false
    exact_deduplication: true
    near_deduplication: true
    near_dedup_threshold: 0.80
    near_dedup_metric: minhash_estimated_jaccard
    near_dedup_num_perm: 128
    near_dedup_bands: 16
    near_dedup_shingle_words: 5
    preserve_duplicate_provenance: true
    source_aware_markup_removal: true
    retain_table_context_or_quarantine: true
    quarantine_table_documents: true
    table_rows_quarantine_threshold: 2
    max_control_character_ratio: 0.001
    repeated_short_line_quarantine_threshold: 12
    filter_languages: [en, ru]
    holdout_contamination_check: true
  mix:
    unit: actual_shinra_tokens
    en: 0.50
    ru: 0.50
    domain_weights: {}
  validation:
    tokenizer_roundtrip_required: true
    numeric_span_integrity_required: true
    malformed_records: reject_with_reason
    train_evaluation_document_overlap_allowed: false
    require_original_raw_sha256: true
    require_declared_train_validation_blind_split: true
  packing:
    policy: isolated_documents
    isolate_document_attention: true
    overlength_document_policy: non_overlapping_document_windows
    chunking_policy_version: isolated-continuation-windows.v1
    chunking_window_semantics: independent_continuation_windows_without_overlap
    max_chunk_tokens: 4096
    parquet_row_group_rows: 128
    bos_per_window: true
    bos_loss: false
    eod_only_on_final_document_window: true
    loss_on_bos: false
    loss_on_eod: true
    loss_on_pad: false
    loss_on_first_token_after_pad: false
    document_end_token_id: 4

training:
  enabled: false
  objective: causal_language_modeling
  initialization: random
  diagnostic_tokens: 20000000
  foundation_tokens: null
  budget_modes: [diagnostic, foundation]
  dataset_exhaustion_policy: cycle_language_permutations_with_schedule_epoch_counter
  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  global_tokens_per_update: 32768
  seed: 42
  dataloader_num_workers: 0
  gradient_checkpointing: true
  max_grad_norm: 1.0
  max_steps: null
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  fail_on_nonfinite_loss_or_gradients: true
  optimizer:
    name: adamw
    learning_rate: 3.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1
    fused: auto
    max_grad_norm: 1.0
  scheduler:
    name: warmup_cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1

precision:
  preferred: bfloat16
  require_hardware_support: true
  fallback: float32
  tf32: true
  attention_implementation: sdpa
  activation_checkpointing: true
  fsdp:
    enabled: false
    implementation_status: unavailable_single_process
    cpu_offload: false
  memory:
    preflight_estimate_required: true
    allocator_headroom_ratio: 0.10
    fail_before_model_allocation_if_unsupported: true

checkpoint:
  output_dir: outputs/shinra
  atomic_save: true
  save_optimizer: true
  save_scheduler: true
  save_rng: true
  save_dataloader_state: true
  resume_requires_matching:
    - architecture_sha256
    - tokenizer_bundle_sha256
    - data_manifest_sha256
    - packed_data_manifests_sha256
    - objective
    - stage
    - training_config_sha256
  retain_full_checkpoints: 2
  never_delete_unconsumed_data: true

evaluation:
  heldout_required: true
  perplexity_batch_size: 1
  continuation_max_new_tokens: 128
  qualitative_max_new_tokens: 256
  benchmark_tasks:
    general: [arc_challenge, hellaswag, winogrande, truthfulqa_mc2]
    knowledge: [mmlu]
    math: [gsm8k, minerva_math]
    code: [humaneval, mbpp]
  benchmark_max_length: 8192
  report_dir: evaluation/results
  report_loss_by: [language, numeric_stratum, source, domain]
  report: [processed_tokens, optimizer_steps, tokens_per_second, peak_gpu_memory, train_loss, heldout_loss]
  blind_manifest_frozen_before_training: true
  identity_in_base_pretraining: false

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_p: 0.9

runtime:
  allowed_gpu_families: [RTX PRO 6000 Blackwell, A100]
  actual_device_query_required: true
  allowed_a100_memory_gb: [40, 80]
  minimum_free_disk_gb: 80
  local_training_allowed: false
  launch_automatically: false
  colab_launch_allowed: false
