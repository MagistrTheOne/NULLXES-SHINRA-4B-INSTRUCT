# Single source of truth for SHINRA model, data policy, training, evaluation,
# checkpointing, and runtime. Training stays disabled until all audit gates pass.
schema_version: nullxes.shinra.v4
status: data_tokenizer_and_runtime_audit_required

identity:
  family: NULLXES-SHINRA
  release: NULLXES-SHINRA-4B-INSTRUCT
  invariant: "I AM SHINRA. CREATED BY NULLXES."
  contract_path: data/identity_contract.v1.json
  contract_sha256: f7772961af4dac55c9ac680527ca19c8d79a09661ddba6b9aff850a877c18e40
  training_category: identity_foundation
  schedule:
    status: specification_only
    initial_optimizer_steps: 100
    identity_examples_per_step: 28
    identity_train_examples: 2800

model:
  model_type: nullxes_shinra
  architectures: [ShinraForCausalLM]
  hidden_size: 2560
  intermediate_size: 9728
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  vocab_size: 65536
  max_position_embeddings: 32768
  train_sequence_length: 4096
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  rope_scaling: {rope_type: default}
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  qk_norm: true
  initializer_range: 0.02
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 3
  document_end_token_id: 4
  z_loss_coefficient: 1.0e-5
  loss_chunk_size: 16
  loss_memory_status: code_candidate_not_runtime_verified
  attention_implementation: sdpa

tokenizer:
  status: provisional_until_corpus_audit
  backend: sentencepiece_native
  native_model_sha256: null  # Pin only after remote candidate artifact review.
  artifact_dir: tokenizer/artifacts
  algorithm: unigram
  vocab_size: 65536
  vocab_candidates: [32768, 49152, 65536, 98304]
  byte_fallback: true
  character_coverage: 0.99995
  normalization: identity  # SentencePiece only; Unicode NFC is data.cleaning.unicode_normalization
  build:
    max_chars: null  # Must be selected from the approved corpus audit before building.
    input_sentence_size: null
    num_threads: null
    max_sentence_bytes: 65536
  split_digits: false
  unk_id: 0
  bos_id: 1
  end_of_turn_id: 2
  pad_id: 3
  end_of_document_id: 4
  special_token_ids:
    system: 5
    user: 6
    assistant: 7
    reasoning: 8
    code: 9
    language: 10
    fim_prefix: 11
    fim_suffix: 12
    fim_middle: 13
    repo: 14
    file: 15
    tool_call: 16
    tool_response: 17
    document: 18
  artifact_sha256: null  # SHA256 identity of tokenizer_manifest.json, NOT tokenizer.json.
  special_tokens:
    unk: "<|unk|>"
    bos: "<|bos|>"
    end_of_turn: "<|eot|>"
    pad: "<|pad|>"
    end_of_document: "<|end_of_text|>"
    system: "<|system|>"
    user: "<|user|>"
    assistant: "<|assistant|>"
    reasoning: "<|reasoning|>"
    code: "<|code|>"
    language: "<|language|>"
    fim_prefix: "<|fim_prefix|>"
    fim_suffix: "<|fim_suffix|>"
    fim_middle: "<|fim_middle|>"
    repo: "<|repo|>"
    file: "<|file|>"
    tool_call: "<|tool_call|>"
    tool_response: "<|tool_response|>"
    document: "<|document|>"
  add_bos_in_tokenizer: false
  chat_template_adds_bos: true
  chat_turn_stop_id: 2
  require_exact_roundtrip: true
  require_zero_unk_on_probes: true
  numeric_rewrite: forbidden

data:
  acquisition: nullxes_synthetic_engine
  training_enabled: false
  corpus_manifest_required: true
  source_manifest_required: false
  manifest_sha256: null
  split_salt: "NULLXES-SHINRA-SYNTHETIC-v1"
  # Descriptive legacy fields only; the actual split is assigned by isolated semantic families below.
  splits: {train: 0.98, validation: 0.01, blind: 0.01}
  split_unit: semantic_template_scenario_family_before_generation
  packed_shard_tokens: 100000000
  synthetic:
    enabled: true
    engine_version: nullxes-synthetic-engine.v5
    verifier_version: nullxes-synthetic-verifiers.v3
    root_seed: 20261019
    records_per_family: 4096
    cross_split_near_duplicate_jaccard: 0.85
    external_text_sources_allowed: false
    external_llm_generation_allowed: false
    status: implementation_not_runtime_verified
    families:
      - {family_id: en.identity.train.v1, language: en, split: train, task_kind: identity, records_per_family: 1400, functional_family: identity.foundation.train.v1, template_family: identity.prompt.train.v1, scenario_family: identity.scenarios.train.v1}
      - {family_id: ru.identity.train.v1, language: ru, split: train, task_kind: identity, records_per_family: 1400, functional_family: identity.foundation.train.v1, template_family: identity.prompt.train.v1, scenario_family: identity.scenarios.train.v1}
      - {family_id: en.identity.validation.v1, language: en, split: validation, task_kind: identity, records_per_family: 350, functional_family: identity.foundation.validation.v1, template_family: identity.prompt.validation.v1, scenario_family: identity.scenarios.validation.v1}
      - {family_id: ru.identity.validation.v1, language: ru, split: validation, task_kind: identity, records_per_family: 350, functional_family: identity.foundation.validation.v1, template_family: identity.prompt.validation.v1, scenario_family: identity.scenarios.validation.v1}
      - {family_id: en.identity.blind.v1, language: en, split: blind, task_kind: identity, records_per_family: 350, functional_family: identity.foundation.blind.v1, template_family: identity.prompt.blind.v1, scenario_family: identity.scenarios.blind.v1}
      - {family_id: ru.identity.blind.v1, language: ru, split: blind, task_kind: identity, records_per_family: 350, functional_family: identity.foundation.blind.v1, template_family: identity.prompt.blind.v1, scenario_family: identity.scenarios.blind.v1}
      - {family_id: en.arithmetic.add.train.v1, language: en, split: train, task_kind: arithmetic, operation: add, functional_family: arithmetic.add.v1, template_family: arithmetic.sum.train.v1, scenario_family: arithmetic.addition.train.v1}
      - {family_id: ru.arithmetic.add.train.v1, language: ru, split: train, task_kind: arithmetic, operation: add, functional_family: arithmetic.add.v1, template_family: arithmetic.sum.train.v1, scenario_family: arithmetic.addition.train.v1}
      - {family_id: en.device.mode.train.v1, language: en, split: train, task_kind: mode_transition, functional_family: device.mode_transition.v1, template_family: device.mode.train.v1, scenario_family: device.start_pause.train.v1}
      - {family_id: ru.device.mode.train.v1, language: ru, split: train, task_kind: mode_transition, functional_family: device.mode_transition.v1, template_family: device.mode.train.v1, scenario_family: device.start_pause.train.v1}
      - {family_id: en.robot.stop_obstacle.train.v2, language: en, split: train, task_kind: grounded_action, scenario: stop_obstacle, functional_family: robot.stop_obstacle.v1, template_family: robot.obstacle_stop.train.v2, scenario_family: robot.clearance_decision.train.v2}
      - {family_id: ru.robot.stop_obstacle.train.v2, language: ru, split: train, task_kind: grounded_action, scenario: stop_obstacle, functional_family: robot.stop_obstacle.v1, template_family: robot.obstacle_stop.train.v2, scenario_family: robot.clearance_decision.train.v2}
      - {family_id: en.robot.action_sequence.train.v2, language: en, split: train, task_kind: grounded_action, scenario: action_sequence, functional_family: robot.action_sequence.v1, template_family: robot.door_sequence.train.v2, scenario_family: robot.door_readiness.train.v2}
      - {family_id: ru.robot.action_sequence.train.v2, language: ru, split: train, task_kind: grounded_action, scenario: action_sequence, functional_family: robot.action_sequence.v1, template_family: robot.door_sequence.train.v2, scenario_family: robot.door_readiness.train.v2}
      - {family_id: en.arithmetic.multiply.validation.v1, language: en, split: validation, task_kind: arithmetic, operation: multiply, functional_family: arithmetic.multiply.v1, template_family: arithmetic.product.validation.v1, scenario_family: arithmetic.multiplication.validation.v1}
      - {family_id: ru.arithmetic.multiply.validation.v1, language: ru, split: validation, task_kind: arithmetic, operation: multiply, functional_family: arithmetic.multiply.v1, template_family: arithmetic.product.validation.v1, scenario_family: arithmetic.multiplication.validation.v1}
      - {family_id: en.inventory.validation.v1, language: en, split: validation, task_kind: inventory, functional_family: inventory.add_remove.v1, template_family: inventory.box.validation.v1, scenario_family: inventory.parts.validation.v1}
      - {family_id: ru.inventory.validation.v1, language: ru, split: validation, task_kind: inventory, functional_family: inventory.add_remove.v1, template_family: inventory.box.validation.v1, scenario_family: inventory.parts.validation.v1}
      - {family_id: en.robot.cancel_action.validation.v2, language: en, split: validation, task_kind: grounded_action, scenario: cancel_action, functional_family: robot.cancel_before_execution.v1, template_family: robot.cancel_queue.validation.v2, scenario_family: robot.cancel_pending_action.validation.v2}
      - {family_id: ru.robot.cancel_action.validation.v2, language: ru, split: validation, task_kind: grounded_action, scenario: cancel_action, functional_family: robot.cancel_before_execution.v1, template_family: robot.cancel_queue.validation.v2, scenario_family: robot.cancel_pending_action.validation.v2}
      - {family_id: en.arithmetic.subtract.blind.v1, language: en, split: blind, task_kind: arithmetic, operation: subtract, functional_family: arithmetic.subtract.v1, template_family: arithmetic.difference.blind.v1, scenario_family: arithmetic.subtraction.blind.v1}
      - {family_id: ru.arithmetic.subtract.blind.v1, language: ru, split: blind, task_kind: arithmetic, operation: subtract, functional_family: arithmetic.subtract.v1, template_family: arithmetic.difference.blind.v1, scenario_family: arithmetic.subtraction.blind.v1}
      - {family_id: en.location.blind.v1, language: en, split: blind, task_kind: location, functional_family: state.location_navigation.v1, template_family: location.coordinates.blind.v1, scenario_family: location.cardinal_moves.blind.v1}
      - {family_id: ru.location.blind.v1, language: ru, split: blind, task_kind: location, functional_family: state.location_navigation.v1, template_family: location.coordinates.blind.v1, scenario_family: location.cardinal_moves.blind.v1}
      - {family_id: en.robot.object_presence.blind.v2, language: en, split: blind, task_kind: grounded_action, scenario: object_presence, functional_family: robot.observed_object_presence.v1, template_family: robot.object_observation.blind.v2, scenario_family: robot.object_grounding.blind.v2}
      - {family_id: ru.robot.object_presence.blind.v2, language: ru, split: blind, task_kind: grounded_action, scenario: object_presence, functional_family: robot.observed_object_presence.v1, template_family: robot.object_observation.blind.v2, scenario_family: robot.object_grounding.blind.v2}
  tokenizer_language:
    enabled: true
    engine_version: nullxes-native-language-engine.v3
    records_per_concept: 128
    root_seed: 20261019
    artifact_name: tokenizer_train.jsonl
    purpose: tokenizer_training_only
    external_text_sources_allowed: false
    external_llm_generation_allowed: false
  cleaning:
    unicode_normalization: NFC
    policy_version: nullxes-synthetic-text.v1
  mix:
    unit: actual_shinra_tokens
    en: 0.50
    ru: 0.50
    domain_weights: {}
  validation:
    tokenizer_roundtrip_required: true
    numeric_span_integrity_required: true
    malformed_records: reject_with_reason
    train_evaluation_document_overlap_allowed: false
    require_original_raw_sha256: true
    require_declared_train_validation_blind_split: true
  packing:
    policy: isolated_documents
    isolate_document_attention: true
    overlength_document_policy: non_overlapping_document_windows
    chunking_policy_version: isolated-continuation-windows.v1
    chunking_window_semantics: independent_continuation_windows_without_overlap
    max_chunk_tokens: 4096
    parquet_row_group_rows: 128
    bos_per_window: true
    bos_loss: false
    eod_only_on_final_document_window: true
    loss_on_bos: false
    loss_on_eod: true
    loss_on_pad: false
    loss_on_first_token_after_pad: false
    document_end_token_id: 4

training:
  enabled: false
  objective: causal_language_modeling
  initialization: random
  diagnostic_tokens: 20000000
  foundation_tokens: null
  budget_modes: [diagnostic, foundation]
  dataset_exhaustion_policy: cycle_language_permutations_with_schedule_epoch_counter
  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  global_tokens_per_update: 32768
  seed: 42
  dataloader_num_workers: 0
  gradient_checkpointing: true
  max_grad_norm: 1.0
  max_steps: null
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  fail_on_nonfinite_loss_or_gradients: true
  optimizer:
    name: adamw
    learning_rate: 3.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1
    fused: auto
    max_grad_norm: 1.0
  scheduler:
    name: warmup_cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1

precision:
  preferred: bfloat16
  require_hardware_support: true
  fallback: float32
  tf32: true
  activation_checkpointing: true
  fsdp:
    enabled: false
    implementation_status: unavailable_single_process
    cpu_offload: false
  memory:
    preflight_estimate_required: true
    allocator_headroom_ratio: 0.10
    fail_before_model_allocation_if_unsupported: true

checkpoint:
  output_dir: outputs/shinra
  atomic_save: true
  save_optimizer: true
  save_scheduler: true
  save_rng: true
  save_dataloader_state: true
  resume_requires_matching:
    - architecture_sha256
    - tokenizer_bundle_sha256
    - data_manifest_sha256
    - packed_data_manifests_sha256
    - objective
    - stage
    - training_config_sha256
  retain_full_checkpoints: 2
  never_delete_unconsumed_data: true

evaluation:
  heldout_required: true
  perplexity_batch_size: 1
  continuation_max_new_tokens: 128
  qualitative_max_new_tokens: 256
  benchmark_tasks:
    general: [arc_challenge, hellaswag, winogrande, truthfulqa_mc2]
    knowledge: [mmlu]
    math: [gsm8k, minerva_math]
    code: [humaneval, mbpp]
  benchmark_max_length: 8192
  report_dir: evaluation/results
  report_loss_by: [language, numeric_stratum, source, domain]
  report: [processed_tokens, optimizer_steps, tokens_per_second, peak_gpu_memory, train_loss, heldout_loss]
  blind_manifest_frozen_before_training: true
  identity_in_base_pretraining: true

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_p: 0.9

runtime:
  allowed_gpu_families: [RTX PRO 6000 Blackwell, A100]
  actual_device_query_required: true
  allowed_a100_memory_gb: [40, 80]
  minimum_free_disk_gb: 80
  local_training_allowed: false
  launch_automatically: false
  colab_launch_allowed: false
