stage: pretrain
output_name: NULLXES-SHINRA-4B-BASE
max_tokens: 200000000000
max_steps: 95367

optimizer:
  name: adamw_torch_fused
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0

scheduler:
  name: wsd
  warmup_steps: 2000
  stable_ratio: 0.80
  min_lr_ratio: 0.10

batch:
  sequence_length: 8192
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  num_processes: 8
  tokens_per_step: 2097152

training:
  seed: 42
  logging_steps: 10
  eval_steps: 1000
  save_steps: 1000
  gradient_checkpointing: true
  dataloader_num_workers: 8
  dataloader_pin_memory: true

hardware:
  gpu: NVIDIA A100 80GB
  node_gpus: 8
  precision: bf16
  flash_attention: true
  fsdp: full_shard
