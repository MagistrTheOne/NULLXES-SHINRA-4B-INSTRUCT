# Google Colab Pro — A100 80GB hypothesis node (screenshot: 167GB RAM / 80GB VRAM).
# Not local RTX 2080. Not the 8× A100 80GB production pretrain.

runtime: google-colab-pro
gpu: NVIDIA A100 80GB
ram_gb: 167
vram_gb: 80
local_gpu: forbidden
note: "Do not load SHINRA-4B weights on RTX 2080. Colab is pipeline + 100M token check."

model:
  name: NULLXES-SHINRA-4B
  attention_implementation: sdpa
  expected_parameters: 3926076416

tokenizer:
  vocab_size: 131072
  output_dir: tokenizer/artifacts

precision:
  dtype: bfloat16

batch:
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_processes: 1
  tokens_per_step: 16384

training:
  gradient_checkpointing: true
  dataloader_num_workers: 2
  purpose: hypothesis_check
  max_tokens: 100000000

storage:
  cache_dir: /content/shinra_cache
  scratch_dir: /content/shinra_scratch
  max_disk_gb: 150

fsdp:
  enabled: false
  cpu_offload: false
