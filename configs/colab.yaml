# G4 hardware profile. Not a pretrain recipe. max_tokens stays 0.

runtime: google-colab
gpu: NVIDIA RTX PRO 6000 Blackwell
gpu_class: G4
compute_capability: sm_120
local_gpu: forbidden
note: "SHINRA v2 G4 hardware. Random init. No from_pretrained. No v1/S0/P0 weights. SDPA only."

model:
  name: NULLXES-SHINRA-4B
  attention_implementation: sdpa
  expected_parameters: 3969056256

tokenizer:
  vocab_size: 131072
  output_dir: tokenizer/artifacts
  hub_repo: MagistrTheOne/NULLXES-SHINRA-4B-INSTRUCT
  hub_allow:
    - tokenizer.json
    - tokenizer_config.json
    - special_tokens_map.json
    - tokenizer.model
    - tokenizer.vocab
  hub_forbid_globs:
    - "*.safetensors"
    - "*.bin"
    - "exp/**"

precision:
  dtype: bfloat16

batch:
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_processes: 1
  tokens_per_step: 16384

training:
  gradient_checkpointing: true
  dataloader_num_workers: 2
  purpose: v2_random_init
  max_tokens: 0
  attention_implementation: sdpa

storage:
  cache_dir: /content/shinra_cache
  scratch_dir: /content/shinra_scratch
  disk_ceiling_gb: 400
  working_cap_gb: 150
  max_disk_gb: 150

fsdp:
  enabled: false
  cpu_offload: false
