# Google Colab G4 — RTX PRO 6000 Blackwell. Random-init bring-up node.
# Not local RTX 2080. Production cluster recipe is not part of architecture v2 freeze.

runtime: google-colab
gpu: NVIDIA RTX PRO 6000 Blackwell
gpu_class: G4
local_gpu: forbidden
note: "SHINRA v2 random init on Colab G4. No from_pretrained. No v1/S0/P0 weights."

model:
  name: NULLXES-SHINRA-4B
  attention_implementation: sdpa
  expected_parameters: 3969056256

tokenizer:
  vocab_size: 131072
  output_dir: tokenizer/artifacts

precision:
  dtype: bfloat16

batch:
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_processes: 1
  tokens_per_step: 16384

training:
  gradient_checkpointing: true
  dataloader_num_workers: 2
  purpose: v2_random_init
  max_tokens: 0

storage:
  cache_dir: /content/shinra_cache
  scratch_dir: /content/shinra_scratch
  max_disk_gb: 150

fsdp:
  enabled: false
  cpu_offload: false
