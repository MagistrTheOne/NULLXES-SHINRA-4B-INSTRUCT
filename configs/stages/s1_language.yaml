# S1 language ignition: +230M to 250M cumulative. This cycle 100% synth.
# Intended later mix 90% synth / 10% curated natural is spec-only.
stage: s1
cumulative_tokens: 250000000
new_tokens: 230000000
max_tokens: 230000000
max_steps: 14039
mix:
  synth: 1.0
  natural: 0.0
intended_mix:
  synth: 0.90
  natural: 0.10
synth_layers:
  language_core: 0.60
  semantic_primitives: 0.15
  compositional: 0.10
  knowledge_shaped: 0.05
  structured: 0.10

optimizer:
  name: adamw_torch_fused
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0

scheduler:
  name: wsd
  warmup_steps: 200
  stable_ratio: 0.80
  min_lr_ratio: 0.10

batch:
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_processes: 1
  tokens_per_step: 16384

training:
  seed: 42
  logging_steps: 10
  eval_steps: 200
  save_steps: 500
  gradient_checkpointing: true
  dataloader_num_workers: 2
  max_tokens: 230000000
  attention_implementation: sdpa
  allow_replay: false

hardware:
  gpu: NVIDIA RTX PRO 6000 Blackwell
  gpu_class: G4
  node_gpus: 1
  precision: bf16
  flash_attention: false
  fsdp: false
