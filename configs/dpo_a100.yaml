stage: dpo
output_name: NULLXES-SHINRA-4B-INSTRUCT-DPO
max_steps: 2000
dpo:
  beta: 0.10

optimizer:
  name: adamw_torch_fused
  learning_rate: 5.0e-7
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  grad_clip: 1.0

scheduler:
  name: cosine
  warmup_steps: 100
  stable_ratio: 0.0
  min_lr_ratio: 0.10

batch:
  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  num_processes: 8
  tokens_per_step: 262144

training:
  seed: 42
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  gradient_checkpointing: true
  dataloader_num_workers: 4

hardware:
  gpu: NVIDIA A100 80GB
  node_gpus: 8
  precision: bf16
  flash_attention: true
  fsdp: full_shard
