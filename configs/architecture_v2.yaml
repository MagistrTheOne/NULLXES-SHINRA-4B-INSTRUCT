# NULLXES SHINRA-4B — architecture v2 ONLY (no recipes, no hardware, no limits)
# Random init. Not identity-conditioning. Parameters: 3,969,056,256 (tied)
# Dead metadata removed: train_sequence_length, sliding_window, layer_types,
# use_cache, hardware, batch, optimizer, scheduler. They live in runtime/stage files.

model:
  name: NULLXES-SHINRA-4B
  model_type: nullxes_shinra
  architectures: [ShinraForCausalLM]
  hidden_size: 2560
  intermediate_size: 9728
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  vocab_size: 131072
  max_position_embeddings: 32768
  hidden_act: silu
  rms_norm_eps: 1.0e-6
  rope_theta: 1000000.0
  rope_scaling:
    rope_type: default
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  qk_norm: true
  initializer_range: 0.02
  bos_token_id: 1
  eos_token_id: 2  # <|eot|> generation / later chat. NOT pretrain document stop
  document_end_token_id: 18  # <|end_of_text|> pretrain wrap terminator
  pad_token_id: 3
  attention_implementation: sdpa
  z_loss_coefficient: 1.0e-5
